.bgtint{position:fixed;inset:0;z-index:-1;background:rgba(250,225,255,.62)}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.hero{padding:10px 4px 6px;text-align:center;margin-bottom:14px}
.hero img.logo{height:52px;width:auto;display:block;margin:0 auto 14px}
h1{font-family:var(--font-head);font-weight:900;font-size:clamp(34px,9vw,56px);line-height:1.04;margin:6px 0 10px;color:var(--purple);letter-spacing:-.01em}
.hero .sub{color:var(--purple);font-weight:700;font-size:16px;text-shadow:0 0 5px #fff,0 0 5px #fff,0 0 9px #fff,0 0 12px #fff}
.sub{color:var(--muted);margin:0 auto;max-width:48ch;font-size:15px}
.tabs{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap;justify-content:center}
.tab{font-family:var(--font-btn);font-weight:800;border:1px solid var(--purple);background:#fff;color:var(--purple);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px;text-align:center}
.tab[aria-selected="true"]{background:var(--purple);color:#fff}
.card{background:var(--card);border:1px solid var(--purple);border-radius:22px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--font-head);font-weight:800;font-size:19px;margin:0 0 4px;color:var(--purple)}
.card .why{color:var(--muted);font-size:13px;margin:0 0 12px}
.sec-title{display:inline-block;font-family:var(--font-head);font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);background:var(--lime);border:1px solid var(--purple);border-radius:999px;padding:5px 14px;margin:8px 0 10px}
.secwrap{text-align:center}

.progress{position:sticky;top:0;z-index:5;padding:8px 0;margin-bottom:10px}
.progress .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.85);overflow:hidden;border:1px solid var(--purple)}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--orange));border-radius:99px;transition:width .3s}
.progress small{color:var(--muted);font-size:12px}
.q{margin-bottom:22px;text-align:left}
.q:last-child{margin-bottom:4px}
.q p{margin:0 0 10px;font-weight:700}
.q .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.sub-q{margin-top:14px;padding-top:14px;border-top:1px dashed var(--peri)}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.opt{font-family:var(--font-btn);border:1px solid var(--purple);background:#fff;color:var(--purple);padding:10px 14px;border-radius:14px;cursor:pointer;font-size:14px;font-weight:700;text-align:left;line-height:1.2}
.opt:hover{background:var(--pink)}
.opt[aria-pressed="true"]{background:var(--purple);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px}
.scale .dot{width:100%;aspect-ratio:1;max-width:56px;justify-self:center;border-radius:50%;padding:0;font-size:16px;text-align:center}
.scale-lbl{display:flex;justify-content:space-between;max-width:360px;margin-top:6px}
.scale-lbl small{color:var(--muted);font-size:12.5px}
@media (max-width:600px){
.card{padding:16px 14px}
.opts{flex-direction:column;gap:8px}
.opts .opt{width:100%;padding:12px 14px;font-size:15px;line-height:1.25}
.scale{gap:6px;max-width:none}
.scale-lbl{max-width:none}
.q{margin-bottom:26px}
}
input[type=text]{width:100%;border:1px solid var(--purple);border-radius:14px;padding:10px;background:#fff;color:var(--text);font:inherit;margin-top:10px}
textarea{width:100%;min-height:90px;border:1px solid var(--purple);border-radius:14px;padding:10px;background:#fff;color:var(--text);font:inherit;resize:vertical}
.center{text-align:center;margin-top:6px}
.btn{font-family:var(--font-btn);font-weight:800;background:var(--purple);color:#fff;border:1px solid var(--purple);border-radius:999px;padding:13px 30px;font-size:16px;cursor:pointer;text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--purple);padding:8px 16px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);text-align:left}
.banner{background:var(--tan);color:var(--wine);border:1px solid var(--purple);border-radius:16px;padding:10px 14px;font-weight:700;font-size:13px;margin-bottom:14px;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-radius:20px;padding:14px;background:#fff;border:1px solid var(--purple);text-align:left}
.kpi b{display:block;font-family:var(--font-head);font-weight:900;font-size:34px;line-height:1;color:var(--purple)}
.kpi span{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi:nth-child(odd){background:var(--pink)}
.insights .why{color:var(--muted)}
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--peri)}
.ins:first-of-type{border-top:0}
.ins i{flex:0 0 14px;height:14px;border-radius:50%;background:var(--lime);border:1px solid var(--purple);margin-top:4px}
.ins b{display:block}
.ins em{display:block;font-style:normal;color:var(--purple);font-weight:700;font-size:13px;margin-top:3px}
.row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.row .track{background:var(--track);border-radius:99px;height:16px;overflow:hidden;border:1px solid var(--purple-soft)}
.row .fill{height:100%;border-radius:99px;background:var(--purple-soft)}
.row .val{font-family:var(--font-head);font-weight:800;min-width:44px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .track{grid-column:1/-1;order:3}}
.stack{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:8px 0;border:1px solid var(--purple)}
.stack div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#222}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--purple)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-family:var(--font-btn);border:1px solid var(--purple);background:#fff;color:var(--purple);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--lav);color:#2d1238}
.delta{display:inline-block;font-family:var(--font-head);font-weight:900;padding:3px 10px;border-radius:99px;background:var(--lime);color:#2c3a10;font-size:13px;border:1px solid var(--purple)}
.delta.neg{background:var(--orange);color:#fff}
.voice{border-left:5px solid var(--lav);background:var(--pink);padding:10px 14px;border-radius:0 14px 14px 0;margin:8px 0;font-size:14px}
.empty{text-align:left;padding:34px 10px;color:var(--muted)}
.thanks{text-align:left;padding:16px 16px 26px}
.thanks img{width:100%;max-width:560px;border-radius:18px;border:1px solid var(--purple);display:block;margin:0 0 16px}
.thanks h2{font-size:clamp(24px,5vw,32px)}
.hide{display:none!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;margin-bottom:14px}
</style>
</head>

function h(tag, props){
  var e=document.createElement(tag);
  if(props){ for(var k in props){
    if(k==='class') e.className=props[k];
    else if(k==='style') e.style.cssText=props[k];
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),props[k]);
    else e.setAttribute(k,props[k]);
  }}
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j]; if(c==null||c===false) continue;
      e.append(c.nodeType?c:document.createTextNode(String(c)));
    }
  }
  return e;
}
function pct(a,b){ return b? Math.round(100*a/b) : 0; }
function avg(arr){ return arr.length? arr.reduce(function(s,x){return s+x;},0)/arr.length : 0; }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1).replace('.',','); }
function idx(arr){ return arr.map(function(x,i){return [i,x];}); }

var GUSTO=[['cursos','Los cursos'],['vivo','Las sesiones en vivo'],['comunidad','La comunidad'],['tina','Tina y Andre'],['juntas','Invertir acompañada'],['retos','Los retos y hábitos'],['lenguaje','El lenguaje cercano'],['otro','Otro']];
var COSTOS=[['tiempo','Encontrar tiempo'],['empezar','No saber por dónde empezar'],['miedo','Miedo a perder plata'],['constancia','Mantener la constancia'],['conexion','Sentirme conectada con la comunidad'],['contenido','Entender el contenido'],['plata','No tener plata para invertir'],['otro','Otro'],['nada','Nada, me fue fácil']];
var CARO=['Para nada: me dio mucho más de lo que pagué','Es justo para lo que me dio','Un poco caro para lo que me dio','Muy caro para lo que me dio'];
var LLEGO=[['instagram','Instagram o TikTok'],['amiga','Recomendación de una amiga'],['linkedin','LinkedIn'],['evento','Un evento'],['otro','Otro']];
var EDAD=['18 a 24','25 a 34','35 a 44','45 a 54','55 o más'];
var OCUP=[['empleada','Empleada en una empresa'],['independiente','Independiente / freelance'],['emprendedora','Emprendedora (negocio propio)'],['estudiante','Estudiante'],['hogar','Hogar y cuidado de otros'],['sin_empleo','Sin empleo por ahora']];
var INGRESO=['Menos de $2 millones','$2 a $4 millones','$4 a $7 millones','$7 a $12 millones','Más de $12 millones'];
var DEPEND=['Ninguna','1','2 a 3','4 o más'];
var DEUDA=['No tengo deudas','Tengo deudas y las pago al día','Tengo deudas y me cuesta pagarlas','Tengo deudas atrasadas'];
var RENUEVA=['Sí, seguro','Tal vez','No'];
var QUEDAN=[['invertir','El hábito de invertir'],['ordenar','El hábito de ordenar mis finanzas'],['confianza','La confianza para decidir con mi plata'],['comunidad','La comunidad de mujeres'],['entender','Entender cómo funciona el dinero'],['relacion','Una relación más sana con el dinero']];

/* ---------- la encuesta ---------- */
var SECTIONS=[
 {t:'Tus cursos', q:[
  {id:'cursos',type:'multi',p:'¿Cuáles de estos cursos terminaste?',hint:'Marca todos los que apliquen',o:CURSOS_O,exclusive:'ninguno'}
 ]},
 {t:'Tu plata', q:[
  {id:'inv',type:'dual',p:'Cuando se trata de invertir…',
    a:{id:'inv_veces',l:'¿Cuántas veces has invertido desde que entraste a Feminario?',o:idx(INV_VECES)},
    b:{id:'inv_conf',l:'¿Qué tan segura te sientes hoy al momento de invertir?',lo:'Nada segura',hi:'Muy segura'}},
  {id:'orden',type:'single',p:'En este tiempo, ¿cuántas veces ordenaste de verdad tus finanzas?',hint:'Registrar gastos, revisar tu presupuesto, ahorrar',o:idx(ORDEN)},
  {id:'decisiones',type:'single',p:'Desde que ordenas tus finanzas, ¿cuántas decisiones económicas has cambiado?',hint:'Gastos, ahorro, deudas, inversión…',o:idx(DECISIONES)},
  {id:'relacion',type:'single',p:'Comparada con antes de entrar, tu relación con el dinero hoy es…',o:idx(RELACION)}
 ]},
 {t:'Tu comunidad', q:[
  {id:'acomp_antes',type:'scale',p:'Antes de Feminario, ¿qué tan acompañada te sentías en tu camino con el dinero?',lo:'Sola',hi:'Muy acompañada'},
  {id:'acomp_hoy',type:'scale',p:'Hoy, ¿qué tan acompañada te sientes?',lo:'Sola',hi:'Muy acompañada'},
  {id:'comunidad',type:'multi',p:'¿Qué hiciste en la comunidad?',hint:'Marca todas las que apliquen',o:COM,exclusive:'nada'},
  {id:'acomp_ta',type:'scale',p:'¿Qué tan acompañada por Tina y Andre te sentiste?',lo:'Nada',hi:'Muchísimo'}
 ]},
 {t:'Tu experiencia', q:[
  {id:'expectativas',type:'single',p:'¿Feminario cumplió tus expectativas?',o:idx(EXPECT),follow:{id:'esperabas',l:'¿Qué esperabas que no pasó?',ph:'Cuéntanos con confianza… (opcional)'}},
  {id:'aprov',type:'single',p:'Mirando hacia atrás, ¿sientes que aprovechaste el club?',o:idx(APROV)},
  {id:'gusto',type:'multi',p:'¿Qué fue lo que MÁS te gustó del club?',hint:'Elige hasta 2',o:GUSTO,max:2,other:{id:'gusto_otro',ph:'Cuéntanos qué fue lo que más te gustó'}},
  {id:'costo',type:'single',p:'¿Qué fue lo que MÁS te costó para seguir con Feminario?',o:COSTOS,other:{id:'costo_otro',ph:'Cuéntanos qué fue lo que más te costó'}},
  {id:'caro',type:'single',p:'¿Te pareció caro Feminario para lo que te dio a tu vida?',o:idx(CARO),follow:{id:'caro_porque',l:'¿Por qué? Cuéntanos con confianza',ph:'Explícanos por qué (opcional)'}},
  {id:'renueva',type:'single',p:'¿Te quedarías en el Club 365 el próximo año?',o:idx(RENUEVA)},
  {id:'abierta',type:'text',p:'Si pudieras cambiar UNA cosa del club, o contarnos lo que más te cambió, ¿cuál sería?',hint:'Opcional'},
  {id:'quedan',type:'text',p:'Y para cerrar: ¿con qué te quedas de Feminario?',hint:'Con tus palabras: un hábito, una confianza, algo que cambió… (opcional)'}
 ]},
 {t:'Sobre ti', note:'Las usamos juntas, solo para ver patrones del grupo.', q:[
  {id:'llego',type:'single',p:'¿Cómo llegaste a Feminario?',o:LLEGO,other:{id:'llego_otro',ph:'Cuéntanos cómo llegaste'}},
  {id:'edad',type:'single',p:'¿Qué edad tienes?',o:idx(EDAD)},
  {id:'ciudad',type:'text',line:true,required:true,p:'¿Dónde vives?',hint:'Escribe tu ciudad y país, y abajo tu dirección',ph:'Ej: Bogotá, Colombia',extra:{id:'direccion',ph:'Dirección (opcional)'}},
  {id:'ocup',type:'multi',p:'¿En qué trabajas?',hint:'Marca todas las que apliquen',o:OCUP,exclusive:'sin_empleo'},
  {id:'ingreso',type:'single',p:'Aproximadamente, ¿cuál es tu ingreso mensual?',hint:'En pesos colombianos',o:idx(INGRESO)},
  {id:'depend',type:'single',p:'Además de ti, ¿cuántas personas dependen económicamente de ti?',o:idx(DEPEND)},
  {id:'deuda',type:'single',p:'Hoy, ¿cómo describirías tus deudas?',o:idx(DEUDA)}
 ]}
];
var QS=[]; SECTIONS.forEach(function(s){ s.q.forEach(function(q){ QS.push(q); }); });
var REQUIRED=QS.filter(function(q){return q.type!=='text'||q.required;});

/* ---------- estado ---------- */
var db=true, user=null, uid='anon', isAdmin=false, canWrite=true;
var ans={}, submitted=false, saving=false, errorMsg='';
var real=[], useDemo=false, fricFilter='all', tab='survey';

/* ---------- encuesta: render ---------- */
function otherSel(q){ var v=ans[q.id]; return Array.isArray(v)?v.indexOf('otro')>-1:v==='otro'; }
function qDone(q){
  var base;
  if(q.type==='dual') base=ans[q.a.id]!==undefined && ans[q.b.id]!==undefined;
  else if(q.type==='multi') base=(ans[q.id]||[]).length>0;
  else if(q.type==='text') base=q.required?(ans[q.id]||'').trim().length>0:true;
  else base=ans[q.id]!==undefined;
  if(!base) return false;
  if(q.other&&otherSel(q)&&!(ans[q.other.id]||'').trim()) return false;
  return true;
}
function refreshState(){
  var done=REQUIRED.filter(qDone).length, total=REQUIRED.length;
  var bar=document.querySelector('.progress .bar i'), sm=document.querySelector('.progress small'), b=document.getElementById('sendbtn');
  if(bar) bar.style.width=pct(done,total)+'%';
  if(sm) sm.textContent=done+' de '+total+' respondidas';
  if(b){ if(done===total&&!saving&&uid&&canWrite!==false) b.removeAttribute('disabled'); else b.setAttribute('disabled',''); }
}
function otherBox(q){
  if(!q.other||!otherSel(q)) return null;
  var inp=h('input',{type:'text',maxlength:'200',placeholder:q.other.ph});
  inp.value=ans[q.other.id]||'';
  inp.addEventListener('input',function(){ ans[q.other.id]=inp.value; refreshState(); });
  return inp;
}
function renderSurvey(){
  var root=document.getElementById('view-survey'); root.textContent='';
  if(submitted){
    root.append(h('div',{class:'card thanks'},
      h('img',{src:DUO,alt:'Tina y Andre'}),
      h('h2',null,'¡Gracias por responder!')));
    return;
  }
  var done=REQUIRED.filter(qDone).length, total=REQUIRED.length;
  root.append(h('div',{class:'progress'},
    h('div',{class:'bar'},h('i',{style:'width:'+pct(done,total)+'%'}))));
  SECTIONS.forEach(function(sec){
    root.append(h('div',{class:'secwrap'},h('span',{class:'sec-title'},sec.t)));
    if(sec.note) root.append(h('p',{class:'note',style:'text-align:center;margin:0 0 10px'},sec.note));
    var card=h('div',{class:'card'});
    sec.q.forEach(function(q){ card.append(renderQ(q)); });
    root.append(card);
  });
  var ready=done===total;
  var btn=h('button',{class:'btn',id:'sendbtn',onclick:submit},saving?'Guardando…':'Enviar mis respuestas');
  if(!ready||saving||!uid||canWrite===false) btn.setAttribute('disabled','');
  root.append(h('div',{class:'center'},btn));
  if(!db||!uid) root.append(h('p',{class:'note'},'Vista previa: para enviar tus respuestas abre el enlace con tu cuenta de acceso.'));
  else if(canWrite===false) root.append(h('p',{class:'note'},'Tu acceso es de solo lectura; pide a Feminario acceso de colaboradora para responder.'));
  if(errorMsg) root.append(h('p',{class:'note',style:'color:#B3360A;font-weight:700'},errorMsg));
}
function titleOf(q){ var p=h('p',null,q.p); if(q.hint) p.append(h('br'),h('span',{class:'hint'},q.hint)); return p; }
function singleOpts(id,o){
  var box=h('div',{class:'opts'});
  o.forEach(function(op){
    box.append(h('button',{class:'opt','aria-pressed':String(ans[id]===op[0]),onclick:function(){ ans[id]=op[0]; renderSurvey(); }},op[1]));
  });
  return box;
}
function scaleOpts(id,lo,hi){
  var dots=h('div',{class:'scale'});
  for(var i=1;i<=5;i++){ (function(v){
    dots.append(h('button',{class:'opt dot','aria-pressed':String(ans[id]===v),onclick:function(){ ans[id]=v; renderSurvey(); }},String(v)));
  })(i); }
  return h('div',{class:'scalebox'},dots,h('div',{class:'scale-lbl'},h('small',null,lo),h('small',null,hi)));
}
function renderQ(q){
  var box=h('div',{class:'q'});
  if(q.type==='dual'){
    box.append(h('p',null,q.p));
    box.append(h('p',{class:'hint',style:'margin-bottom:8px'},q.a.l), singleOpts(q.a.id,q.a.o));
    box.append(h('div',{class:'sub-q'},h('p',{class:'hint',style:'margin-bottom:8px'},q.b.l), scaleOpts(q.b.id,q.b.lo,q.b.hi)));
    return box;
  }
  box.append(titleOf(q));
  if(q.type==='single'){
    box.append(singleOpts(q.id,q.o));
    var ob1=otherBox(q); if(ob1) box.append(ob1);
    if(q.follow){
      var ta=h('textarea',{maxlength:'600',placeholder:q.follow.ph});
      ta.value=ans[q.follow.id]||'';
      ta.addEventListener('input',function(){ ans[q.follow.id]=ta.value; });
      box.append(h('div',{class:'sub-q'},h('p',{class:'hint',style:'margin-bottom:8px'},q.follow.l),ta));
    }
  }
  else if(q.type==='scale') box.append(scaleOpts(q.id,q.lo,q.hi));
  else if(q.type==='multi'){
    var m=h('div',{class:'opts'});
    q.o.forEach(function(op){
      var on=(ans[q.id]||[]).indexOf(op[0])>-1;
      m.append(h('button',{class:'opt','aria-pressed':String(on),onclick:function(){
        var c=(ans[q.id]||[]).slice();
        if(q.exclusive&&op[0]===q.exclusive){ c=on?[]:[q.exclusive]; }
        else {
          if(q.exclusive) c=c.filter(function(x){return x!==q.exclusive;});
          var i=c.indexOf(op[0]);
          if(i>-1) c.splice(i,1); else { c.push(op[0]); if(q.max&&c.length>q.max) c.shift(); }
        }
        ans[q.id]=c; renderSurvey();
      }},op[1]));
    });
    box.append(m);
    var ob2=otherBox(q); if(ob2) box.append(ob2);
  } else {
    var t=q.line?h('input',{type:'text',maxlength:'100',placeholder:q.ph||''}):h('textarea',{maxlength:'600',placeholder:'Escríbelo como lo sientas…'});
    t.value=ans[q.id]||'';
    t.addEventListener('input',function(){ ans[q.id]=t.value; refreshState(); });
    box.append(t);
    if(q.extra){
      var t2=h('input',{type:'text',maxlength:'150',placeholder:q.extra.ph});
      t2.value=ans[q.extra.id]||'';
      t2.addEventListener('input',function(){ ans[q.extra.id]=t2.value; });
      box.append(t2);
    }
  }
  return box;
}

var ENDPOINT='https://script.google.com/macros/s/AKfycbw6bPQTSW70_pVscB-5rjoikbtKg911ra_lk44Xn1HAttquoO1Ss7elDQCgAFRe1K8nog/exec';
function rid(){ try{ return crypto.randomUUID().replace(/-/g,'').slice(0,12); }catch(e){ return String(Date.now())+Math.random().toString(36).slice(2,8); } }
var SUBMIT_ID=rid();
function labels(list,ids){ return (ids||[]).map(function(i){ return lbl(list,i); }).join('; '); }
function lbl(list,id){ for(var i=0;i<list.length;i++){ if(list[i][0]===id) return list[i][1]; } return id; }
function lblOther(list,id,txt){ return id==='otro'?('Otro: '+(txt||'').trim().slice(0,100)):lbl(list,id); }
function buildPayload(){
  var cur=ans.cursos||[], n=cur.filter(function(x){return x!=='ninguno';}).length;
  function yn(id){ return cur.indexOf(id)>-1?'Sí':'No'; }
  return {
    id_respuesta:SUBMIT_ID,
    website:'',
    cursos_terminados:labels(CURSOS_O,cur),
    n_cursos:n,
    curso_she_invest:yn('sheinvest'),
    curso_la_ruta:yn('ruta'),
    curso_cripto:yn('cripto'),
    curso_inversiones_sostenibles:yn('sost'),
    curso_comprar_dolares:yn('dolares'),
    veces_invirtio:INV_VECES[ans.inv_veces],
    confianza_invertir_1a5:ans.inv_conf,
    veces_ordeno_finanzas:ORDEN[ans.orden],
    decisiones_cambiadas:DECISIONES[ans.decisiones],
    relacion_con_dinero:RELACION[ans.relacion],
    acompanada_antes_1a5:ans.acomp_antes,
    acompanada_hoy_1a5:ans.acomp_hoy,
    cambio_acompanamiento:ans.acomp_hoy-ans.acomp_antes,
    participo_en_comunidad:labels(COM,ans.comunidad),
    acompanada_tina_andre_1a5:ans.acomp_ta,
    cumplio_expectativas:EXPECT[ans.expectativas],
    que_esperabas_que_no_paso:(ans.esperabas||'').trim().slice(0,600),
    aprovecho_el_club:APROV[ans.aprov],
    lo_que_mas_gusto:labels(GUSTO,ans.gusto),
    gusto_otro_texto:((ans.gusto||[]).indexOf('otro')>-1?(ans.gusto_otro||'').trim().slice(0,200):''),
    lo_que_mas_costo:lbl(COSTOS,ans.costo),
    costo_otro_texto:(ans.costo==='otro'?(ans.costo_otro||'').trim().slice(0,200):''),
    precio_vs_valor:CARO[ans.caro],
    por_que_precio:(ans.caro_porque||'').trim().slice(0,400),
    renovaria_club365:RENUEVA[ans.renueva],
    comentario_abierto:(ans.abierta||'').trim().slice(0,600),
    se_queda_con:(ans.quedan||'').trim().slice(0,600),
    como_llego:lblOther(LLEGO,ans.llego,ans.llego_otro),
    edad_rango:EDAD[ans.edad],
    ciudad:(ans.ciudad||'').trim().slice(0,100),
    direccion:(ans.direccion||'').trim().slice(0,150),
    ocupacion:labels(OCUP,ans.ocup),
    ingreso_mensual_cop:INGRESO[ans.ingreso],
    personas_a_cargo:DEPEND[ans.depend],
    situacion_deudas:DEUDA[ans.deuda]
  };
}
async function submit(){
  if(saving) return;
  if(ENDPOINT.indexOf('http')!==0){ errorMsg='Falta pegar la URL del backend (ENDPOINT) en el archivo.'; renderSurvey(); return; }
  saving=true; errorMsg=''; renderSurvey();
  try{
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(buildPayload())});
    submitted=true;
  }catch(e){
    errorMsg='No pudimos enviar tu respuesta. Revisa tu conexión e inténtalo otra vez.';
  }
  saving=false; renderSurvey();
}
renderSurvey();
})();
</script>
